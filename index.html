<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
		<meta name="theme-color" content="#0b0f17">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<title>JApps — Jeebus’ Apps</title>
		<link rel="icon" href="favicon.ico" sizes="any">
		<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
		<link rel="stylesheet" href="./assets/site.css">
	</head>
	<body>
		<div class="wrap">
			<header>
				<div>
					<h1>Jeebus' Apps</h1>
					<div class="sub">
						These are all of my web-based applications, all in one place.
					</div>
				</div>
			</header>

			<div class="fadeWrap fadeScroll" id="toolbarFade" style="margin-bottom: 12px;">
				<div class="toolbar hScroll" id="toolbarScroll">
					<div class="pill" id="storagePill">Storage: Local</div>
					<div class="pill" id="tzPill">Local TZ: —</div>
				</div>
			</div>

			<div style="display: flex; justify-content: center; margin-bottom: 14px;">
				<button class="suggestBtn" id="suggestToolBtn">
					<span class="tabDot"></span> Suggest a Tool
				</button>
			</div>

			<div class="grid" id="appsGrid" style="width: 100%;"></div>

			<!-- Suggest a Tool modal -->
			<div class="modalOverlay" id="suggestModal">
				<div class="modalCard card">
					<div class="head">
						<div class="title">Suggest a Tool</div>
						<button class="modalClose" id="suggestClose">&times;</button>
					</div>
					<form class="form" id="suggestForm" autocomplete="off">
						<div class="field">
							<label class="label" for="suggestTitle">Title *</label>
							<input type="text" id="suggestTitle" placeholder="Name of the tool or app" required maxlength="100">
						</div>
						<div class="field">
							<label class="label" for="suggestDesc">Description *</label>
							<textarea id="suggestDesc" placeholder="What should it do? Any details help." required maxlength="1000"></textarea>
						</div>
						<div class="field">
							<label class="label" for="suggestName">Your Name <span class="muted" style="font-weight:400;">(optional, blank = anonymous)</span></label>
							<input type="text" id="suggestName" placeholder="Anonymous" maxlength="50">
						</div>
						<div id="suggestStatus" class="help" style="min-height:1.35em;"></div>
						<button type="submit" id="suggestSubmitBtn" class="smallBtn">Submit Suggestion</button>
					</form>
				</div>
			</div>
			<div class="footer" style="display: flex; justify-content: center;">
				<code class="inline" id="versionCode">v—</code>
			</div>
		</div>

		<div class="tabsBar" style="width: 100%;">
			<nav class="tabs">
				<a class="tabBtn active" data-tab="home" href="./"><span class="tabDot"></span> Home</a>
				<a class="tabBtn" data-tab="about" href="./pages/about/"><span class="tabDot"></span> About</a>
				<a class="tabBtn" data-tab="settings" href="./pages/settings/"><span class="tabDot"></span> Settings</a>
			</nav>
		</div>

		<script type="module">
			import {
				attachFadeToScroller,
				autoMarkActiveTab,
				initAppSettings,
				startOrbBackgroundFromSettings,
				_VERSION
			} from "./assets/site.js"
			
			import { APPS } from "./assets/apps.js"
			import { SUGGESTIONS } from "./assets/config.js"
			
			// Always-run boot (won’t brick if api/db/oauth are broken)
			const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Local"
			document.getElementById("tzPill").textContent = `Local TZ: ${tz}`
			
			fetch("./assets/versions.json", { cache: "no-store" })
				.then(r => r.json())
				.then(d => { document.getElementById("versionCode").textContent = `v${d.current || _VERSION}` })
				.catch(() => { document.getElementById("versionCode").textContent = `v${_VERSION}` })
			
			initAppSettings()
			startOrbBackgroundFromSettings({ spawnEveryMs: 1600, sizeMin: 340, sizeMax: 720 })
			autoMarkActiveTab("home")
			
			attachFadeToScroller(
				document.getElementById("toolbarScroll"),
				document.getElementById("toolbarFade")
			)
			
			// Render app tiles from a single table (assets/apps.js)
			const appsGrid = document.getElementById("appsGrid")
			
			function setDotState(dotEl, state){
				// state: "ok" | "loading" | "error" | "off"
				if (!dotEl) return
				dotEl.classList.remove("warn", "bad", "off", "ok")
				if (state === "loading") dotEl.classList.add("warn")
				else if (state === "error") dotEl.classList.add("bad")
				else if (state === "off") dotEl.classList.add("off")
				else dotEl.classList.add("ok")
			}
			
			function escapeAttr(s){
				return String(s ?? "")
					.replaceAll("&", "&amp;")
					.replaceAll("\"", "&quot;")
					.replaceAll("<", "&lt;")
					.replaceAll(">", "&gt;")
			}
			
			function renderApps(list){
				appsGrid.innerHTML = ""

				// Group apps by section
				const groups = new Map()
				for (const app of list){
					const section = (app.section || "Other").trim() || "Other"
					if (!groups.has(section)) groups.set(section, [])
					groups.get(section).push(app)
				}

				// Optional: sort sections (puts "Other" last)
				const sectionNames = Array.from(groups.keys()).sort((a, b) => {
					if (a === "Other") return 1
					if (b === "Other") return -1
					return a.localeCompare(b)
				})

				for (const sectionName of sectionNames){
					const safeSection = escapeAttr(sectionName)
					const sectionId = `section_${sectionName.replaceAll(/[^a-z0-9_\-]/gi, "_")}`

					// Section card shell (one per section)
					appsGrid.insertAdjacentHTML("beforeend", `
						<section class="card appSection" id="${sectionId}">
							<div class="head">
								<div class="title">${safeSection}</div>
							</div>
							<div class="appSectionGrid"></div>
						</section>
					`)

					const grid = document.querySelector(`#${CSS.escape(sectionId)} .appSectionGrid`)

					// Render apps inside the section card
					for (const app of groups.get(sectionName)){
						const key = app.key || app.title || "app"
						const dotId = `appDot_${key.replaceAll(/[^a-z0-9_\-]/gi, "_")}`

						const icon = escapeAttr(app.icon)
						const title = escapeAttr(app.title)
						const href = escapeAttr(app.href)
						const aria = escapeAttr(app.ariaLabel || `Open ${app.title}`)
						const target = app.external ? ` target="_blank" rel="noopener"` : ""

						grid.insertAdjacentHTML("beforeend", `
							<div class="appTile">
								<div class="appTileTop">
									<span class="statusDot off" id="${dotId}"></span>
									<div class="appTileTitle">${title}</div>
								</div>

								<div class="appBody">
									<a class="appIconLink" href="${href}" aria-label="${aria}"${target}>
										<img class="appIcon" src="${icon}" alt="${title}" loading="lazy" decoding="async">
									</a>
								</div>
							</div>
						`)

						setDotState(document.getElementById(dotId), app.state || "ok")
					}
				}
			}

			renderApps(APPS)

			// ── Suggest-a-Tool modal ──
			const suggestModal   = document.getElementById("suggestModal")
			const suggestForm    = document.getElementById("suggestForm")
			const suggestStatus  = document.getElementById("suggestStatus")
			const suggestSubmit  = document.getElementById("suggestSubmitBtn")

			function openModal()  { suggestModal.classList.add("open") }
			function closeModal() { suggestModal.classList.remove("open"); suggestStatus.textContent = "" }

			document.getElementById("suggestToolBtn").addEventListener("click", openModal)
			document.getElementById("suggestClose").addEventListener("click", closeModal)
			suggestModal.addEventListener("click", e => { if (e.target === suggestModal) closeModal() })

			const COOLDOWN_KEY = "japps_suggest_last"

			function getCooldownRemaining() {
				const last = parseInt(localStorage.getItem(COOLDOWN_KEY) || "0", 10)
				if (!last) return 0
				const elapsed = Date.now() - last
				return Math.max(0, SUGGESTIONS.cooldownMs - elapsed)
			}

			suggestForm.addEventListener("submit", async e => {
				e.preventDefault()

				const remaining = getCooldownRemaining()
				if (remaining > 0) {
					const secs = Math.ceil(remaining / 1000)
					suggestStatus.textContent = `Please wait ${secs}s before submitting again.`
					return
				}

				if (!SUGGESTIONS.workerUrl) {
					suggestStatus.textContent = "Suggestions are currently disabled."
					return
				}

				const title = document.getElementById("suggestTitle").value.trim()
				const desc  = document.getElementById("suggestDesc").value.trim()
				const name  = document.getElementById("suggestName").value.trim() || "Anonymous"

				if (!title || !desc) return

				suggestSubmit.disabled = true
				suggestStatus.textContent = "Sending…"

				try {
					const res = await fetch(SUGGESTIONS.workerUrl, {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify({ title, desc, name }),
					})

					if (res.ok) {
						localStorage.setItem(COOLDOWN_KEY, String(Date.now()))
						suggestStatus.textContent = "Suggestion sent — thank you!"
						suggestForm.reset()
					} else {
						suggestStatus.textContent = `Failed to send (HTTP ${res.status}). Try again later.`
					}
				} catch (err) {
					suggestStatus.textContent = "Network error — please try again."
				} finally {
					suggestSubmit.disabled = false
				}
			})
		</script>
	</body>
</html>
